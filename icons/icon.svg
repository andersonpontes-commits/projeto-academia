<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#121721"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <!-- Haltere estilizado moderno -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Barra central -->
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#f8fafc"/>
    <!-- Anilhas esquerdas -->
    <rect x="-150" y="-80" width="30" height="160" rx="15" fill="url(#neonGrad)"/>
    <rect x="-175" y="-60" width="20" height="120" rx="10" fill="url(#neonGrad)" opacity="0.85"/>
    <!-- Anilhas direitas -->
    <rect x="120" y="-80" width="30" height="160" rx="15" fill="url(#neonGrad)"/>
    <rect x="155" y="-60" width="20" height="120" rx="10" fill="url(#neonGrad)" opacity="0.85"/>
  </g>
</svg>
